[server]
host = "localhost"
port = 9999

[display]
max_lines = 10000

[log_format]
pattern = "^\\[(?P<timestamp>.*?)\\]\\s*\\[(?P<level>\\w+)\\]\\s*(?P<message>.*)"

[colors.DEBUG]
bg = "#5e5c64"
fg = "#ffffff"

[colors.INFO]
bg = "#26a269"
fg = ""

[colors.WARNING]
bg = "#ff7800"
fg = ""

[colors.ERROR]
bg = "#f66151"
fg = ""

[colors.CRITICAL]
bg = "#a51d2d"
fg = ""

[theme]
name = "dark_red.xml"
